name: CI — tests

# WHY THIS EXISTS (2026-08-11, owner decision on issue #49)
#
# There was NO workflow that ran the suite. `.github/` held only `claude-review.yml` (and,
# until #59 retired it, `claude-fix.yml`), and the only mention of pytest in either was
# inside the agent's `--allowedTools` — a permission to run tests, not a job that runs
# them. So ~500
# host-independent tests, including every regex in the doc-claims registry, were guarded by
# nothing but whoever remembered to type `pytest` before pushing. The registry's own history
# is the argument: a hole in it was found by hand, fixed, and the probe that found it was
# never committed, so re-opening it would have been silent on every machine.
#
# This job is the floor. It is not a substitute for ai-lab-0 — see the two exclusions below.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A PR that is pushed three times should be tested once. `main` is PR-only under branch
# protection, so the push trigger fires on merge and is worth keeping un-cancelled per SHA.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      # uv, not pip and not `python -m venv` — the repo standardised on it (owner,
      # 2026-08-01) and `tests/test_gate_scripts.py::test_no_uv_run_in_*` polices only the
      # `uv run` INVOCATION style, which stays retired. Creating and populating the venv is
      # exactly what uv is still for.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # ⚠ THE VENV PATH IS LOAD-BEARING, NOT A PREFERENCE. Five tests fail on a tree with no
      # `.venv` for no reason but its absence: `test_python_is_the_repo_venv` asserts it
      # directly, and every gate in `tests/test_gate_scripts.py` runs its script as a
      # subprocess of `.venv/bin/python`, so a missing interpreter is a FileNotFoundError
      # rather than a skip. A CI job that installed into the system Python would have gone
      # red for a reason that has nothing to do with the change under review, which is how a
      # check gets ignored and then removed.
      - name: Create the repo venv
        run: uv venv --python 3.11 .venv

      # ⚠ TORCH IS DELIBERATELY ABSENT — ~2 GB of wheel for the handful of tests that
      # `pytest.importorskip` past without it. It also keeps CI's shape equal to the HOST
      # venv's, which carries no torch either, so a green run here means the same thing a
      # developer's `make test` means instead of exercising a different set of tests from
      # everyone who will read the result. (The retired `claude-fix.yml` made the same call
      # with a shorter list — no `fastapi`, no `pysbd` — which is why it reported one
      # failure it could not explain.)
      #
      # NOT `-e '.[dev]'`: installing the PROJECT pulls `install_requires`, torch included,
      # and builds matcha's Cython extension. A PEP 735 dependency GROUP is a different
      # mechanism — `--group test` resolves on its own, with no project install — which is
      # why the test set can live in one place after all.
      #
      # ⚠ THIS STEP USED TO RESTATE THE LIST, AND THE FLOOR WITH IT. `pytest>=9.1` was
      # written here as well as in `pyproject.toml`, deliberately, because at the time
      # nothing the runner installed from carried it. #65 landed `[dependency-groups] test`,
      # so that is no longer true and the duplication is now a fork waiting to happen: two
      # statements of one fact that nothing checks for agreement. The group is the single
      # declaration of what it takes to run this suite — extend it there, never here.
      #
      # ⚠ The floor is enforced TWICE and the halves do different jobs, so do not remove
      # either. `pytest>=9.1` in the group is a RESOLVER constraint and binds only this
      # install path; `[tool.pytest.ini_options] minversion = "9.1"` is what refuses at RUN
      # time, which is what catches an interpreter that got pytest from somewhere else. The
      # floor is load-bearing rather than hygiene: 9.1 narrowed `importorskip`'s exception
      # envelope, and the wide one silently turns the retirement guards in
      # tests/test_engine_allocation.py into skips.
      - name: Install the test dependency group
        run: uv pip install --python .venv/bin/python --group test

      # ⚠ DATA-GATED TESTS WILL SKIP HERE AND THAT IS THE DESIGN. `/data` is ai-lab-0's
      # mount and `data/` is untracked (`.gitignore`), so the corpus artifacts do not exist
      # on a runner. `test_data_gated_gate` skips when none of its prerequisites is present
      # — "the corpus is not on this machine" is not a finding. ⚠ Note what that means for
      # the gate script itself: `pyproject.toml`'s `testpaths = "tests/"` does not collect
      # `scripts/gates/test_doc_claims.py`, and the one test that would run it as a subprocess
      # skips here, so ITS per-fact skip machinery never executes in this job. Do not read
      # a green run as having exercised it. What this job guards is the
      # ~500 host-independent tests, including `tests/test_doc_claims_registry.py`, which is
      # the entire doc-claims REGISTRY exercised in both directions with no artifacts at all.
      #
      # -rs prints the skip reasons: a job whose coverage quietly shrinks is worse than none.
      - name: Run the suite
        run: .venv/bin/python -m pytest -q -rs

      # ---------------------------------------------------------------- lint (issue #70)
      #
      # `.pre-commit-config.yaml` has configured black, isort, pyupgrade, flake8 and pylint
      # since before this job existed, and NOTHING enforced any of it: a local hook that
      # `--no-verify` skips and a fresh clone never installs. That is AGENTS.md §1's own
      # lesson about lint — *a rule is not an enforcement mechanism* — so the authority has
      # to be the check on the pull request.
      #
      # SPLIT INTO BLOCKING AND ADVISORY FROM MEASUREMENT, not taste (2026-08-12):
      #
      #   pyflakes F-codes    0 findings, after this PR's fixes  -> BLOCKING
      #   black --check     145 of 191 files would be reformatted -> advisory
      #   isort --check      92 files                             -> advisory
      #   flake8 E-codes    191 findings (85 of them E741)        -> advisory
      #
      # Blocking the F-codes costs nothing today and would have caught, this week alone: an
      # `undefined name` in a test invisible behind a torch `importorskip`, six duplicate
      # alias imports, and a shadowed import a reviewer had to find by hand. Blocking the
      # other three would require a 237-file reformat commit first — a separate decision,
      # which is why they report instead of enforce.
      #
      # ⚠ The flake8 args live ONLY in the pre-commit hook (there is no `.flake8` or
      # `setup.cfg`), so they are repeated here deliberately — and a BARE `flake8` run
      # measures a different tool: 79-char default, none of the ignores. That duplication is
      # a config-drift risk of exactly the kind #70 names; consolidating it is that issue's
      # option 2, not this step's job.
      # ⚠ TARGET `git ls-files`, NEVER `.`. Two reasons, both cost a red first run:
      #   * `--exclude` REPLACES flake8's defaults rather than adding to them (that is what
      #     `--extend-exclude` is for) — and `.venv` was never in those defaults anyway;
      #   * line 54 of this job creates `.venv` INSIDE the workspace and the lint step then
      #     installs flake8 into it, so `.` walks `.venv/lib/python3.11/site-packages/**`
      #     and lints third-party code. That is what happened: the gate went red on
      #     `_pytest`, `cffi` and `anyio`.
      # It passed locally only because `.venv` is a SYMLINK on the dev host and flake8 does
      # not walk symlinks — a difference in the environment, not in the command. Listing
      # tracked files removes the whole class: an untracked directory cannot appear.
      #
      # ⚠ `--select=E9,F`, NOT `--select=F`. flake8 reports a file that does not parse as
      # `E999`, which is not an F-code — so `--select=F` passes an unparseable file SILENTLY
      # and takes every genuine F-code in it along too. Verified: two broken files, exit 0.
      # A gate that cannot see a syntax error is the wrong gate for a PR that exists because
      # a SyntaxError shipped.
      - name: Lint — real-defect classes (blocking)
        run: |
          uv pip install --python .venv/bin/python 'flake8==7.0.0'
          git ls-files -z '*.py' | xargs -0 .venv/bin/python -m flake8 \
            --select=E9,F --extend-ignore=F401,F841 --max-line-length 120

      # `if: always()` — NOT just `continue-on-error`. That flag governs what happens when
      # THIS step fails; a step with no `if:` is skipped when an EARLIER one already failed.
      # So without this the drift report goes dark exactly when the blocking gate trips,
      # which is the moment someone needs the numbers.
      - name: Lint — formatting and style (advisory)
        if: always()
        continue-on-error: true
        run: |
          uv pip install --python .venv/bin/python 'black==23.12.1' 'isort==5.13.2'
          echo '::group::black'
          git ls-files -z '*.py' | xargs -0 .venv/bin/python -m black --check || true
          echo '::endgroup::'
          echo '::group::isort'
          git ls-files -z '*.py' | xargs -0 .venv/bin/python -m isort --check-only --profile black || true
          echo '::endgroup::'
          echo '::group::flake8 style'
          git ls-files -z '*.py' | xargs -0 .venv/bin/python -m flake8 --max-line-length 120 \
            --extend-ignore E203,E402,E501,F401,F841,RST2,RST301 || true
          echo '::endgroup::'
