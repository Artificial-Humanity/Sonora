name: Janis — PR Review

on:
  pull_request:
    types: [opened, synchronize]

# `synchronize` fires on EVERY push to an open PR. Without this group, three
# quick pushes run three concurrent reviews and you are billed for all three
# while only the last one is worth reading.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip bot-initiated runs — CLEANLY, rather than letting the action refuse them.
    #
    # `synchronize` fires on every push to an open PR, and the fix pass pushes. So
    # Quincy's commits re-trigger this review, the action sees a non-human actor and
    # fails the job: "Workflow initiated by non-human actor ... Add bot to allowed_bots".
    # Taking that suggestion would re-enable exactly the oscillation the fix lane is
    # label-gated to prevent (fix pushes -> review -> fix -> ...), billed in full each
    # lap. Skipping is also the intended design: Quincy answers and resolves each
    # finding in its own thread, so a whole-PR re-review after a fix pass was never
    # wanted. A red X for working-as-designed is noise that trains you to ignore the
    # check.
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest

    # REQUIRED — not optional boilerplate. This repo's default workflow token is
    # read-only (`default_workflow_permissions: "read"`, checked 2026-08-10), so
    # without this block the review runs to completion, bills the tokens, and
    # then cannot post a single comment. The failure is silent in the sense that
    # the analysis succeeds; only the delivery fails.
    permissions:
      contents: read
      pull-requests: write
      # Filing findings as issues needs WRITE; even reading the ledger needs READ. Without
      # this the agent reports "I could not check for duplicates" and we read it as a
      # limitation of the tool rather than a permission we withheld — exactly how
      # "Python execution was blocked in this sandbox" was misread for two days.
      issues: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python for verification
        # WITHOUT THIS THE AGENTS CANNOT CHECK THEIR OWN WORK. Both of them reported
        # "Python execution was blocked in this sandbox" and inferred a sandbox limit;
        # it was not. GitHub runners ship Python — what was missing was the tool grant
        # below, and the deps. So every finding either agent made was reasoned from
        # READING, and the fix pass shipped 11 unverified edits on PR #10 (one of which
        # left a latent defect that only surfaced when the tests were run by hand).
        #
        # TORCH IS DELIBERATELY NOT INSTALLED. It is ~2 GB for exactly ONE test file
        # (tests/test_gate_scripts.py). Measured 2026-08-10 without it:
        #   516 passed · 9 skipped · 1 failed (env-gated doc check) — in 3.2 seconds.
        # So ~98% of the suite is verifiable for about a minute of CI, and the last 2%
        # costs more than the whole review does.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the non-torch test dependencies
        # Best-effort on purpose: a dependency hiccup must not fail the REVIEW, which is
        # useful even when it cannot run anything. The agent is told below to say so
        # rather than claim verification it did not do.
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml numpy scipy librosa soundfile unidecode inflect \
            || echo "DEP INSTALL FAILED — the agent must report findings as unverified"

      - name: Run Claude Review Agent
        uses: anthropics/claude-code-action@v1
        with:
          # The INPUT name is fixed by the action (`claude_code_oauth_token`);
          # the SECRET is the org-level `CLAUDE_OAUTH_TOKEN`. These deliberately
          # do not match — do not "fix" the left side to agree with the right.
          claude_code_oauth_token: ${{ secrets.CLAUDE_OAUTH_TOKEN }}


          # --allowedTools is what actually lets the agent reach GitHub. Without
          # it the model can analyze the diff but has no mechanism to post, so a
          # prompt asking for "inline comments" produces nothing. This is the
          # second half of the permissions problem above: permissions grant the
          # token the right, --allowedTools grants the agent the tool.
          #
          # `--effort` is deliberately absent: it is not a documented claude_args
          # flag, and Claude Code already defaults to xhigh effort on capable
          # models, so naming it buys nothing and risks failing on an unknown arg.
          claude_args: >-
            --model claude-opus-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(python:*),Bash(python3:*),Bash(pytest:*),Bash(pip:*),Bash(gh issue:*),Bash(gh search:*)"

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are an elite, pedantic Senior Code Reviewer. Review this pull
            request's diff thoroughly, focusing on architectural flaws,
            edge-case logic bugs, security vulnerabilities, and performance
            bottlenecks.


            IDENTITY — you are **Janis**, the reviewer. Both agents post from the same
            `claude[bot]` GitHub account, so the ONLY way a reader can tell your voice
            from the fixer's is that you label it. Begin every comment you post — the
            top-level review and every inline comment — with exactly:

              🔍 **Janis** · review

            on its own line, then a blank line, then the content. Never omit it, and
            never use Quincy's badge: a misattributed comment is worse than an unlabelled
            one, because it sends the reader to the wrong agent's reasoning.

            Report every issue that could cause incorrect behavior, a test
            failure, a security weakness, or a misleading result — including
            findings you are uncertain about. Give each one an explicit
            severity so it can be triaged. Only omit pure nits: formatting,
            naming preferences, and style that no reader would act on.
            Do not filter beyond that bar — a qualitative instruction like
            "only report important issues" is followed literally and silently
            drops real bugs.

            The PR branch is already checked out in the working directory.

            VERIFY, DO NOT ONLY REASON. Python and the non-torch test dependencies are
            installed for you — `pytest tests/ -q` runs ~516 tests in about 3 seconds.
            Before you report a finding you could have checked by running something,
            RUN IT. A finding you reproduced outranks three you inferred.

            ⚠ `tests/test_gate_scripts.py` needs torch, which is deliberately NOT
            installed (~2 GB for one file). Skip it rather than reporting its collection
            error as a defect. If the dependency install failed, say so plainly in the
            review and mark every finding as unverified — never imply you ran something
            you did not.

            FINDINGS BECOME ISSUES, NOT BLOCKING COMMENTS (owner, 2026-08-10).

            STEP 0 — BEFORE YOU READ THE DIFF, fetch the finding ledger ONCE:

              gh issue list --repo ${{ github.repository }} --state all --limit 150 \
                --label review-finding --json number,title,body,state,createdAt,updatedAt

            One call, bodies included, and it is the ONLY time you query issues in this
            run. HOLD IT IN CONTEXT for the whole review. Do NOT re-query — in particular,
            never search for an issue you filed yourself this run: GitHub's search index
            lags by seconds to minutes, so a re-query would miss it and you would file the
            same finding twice. Track what you file in your own head instead.

            ⚠ If that call returns the full 150, or errors, SAY SO IN YOUR SUMMARY and
            mark the duplicate check as PARTIAL. "No duplicate found" must never mean
            "I did not look far enough" — a dedup claim you cannot support is worse than
            no dedup, because it gets trusted.

            Read the ledger's titles first as a rough prior for what is already known,
            then use the fingerprint for the actual decision.

            FOR EACH FINDING, exactly one of three:

            * **NEW** -> file an issue.
                gh issue create --repo ${{ github.repository }} \
                  --label review-finding --title "<the finding>" --body "..."
              ⚠ THE TITLE IS THE FINDING, never your badge. An agent picking this up may
              have no idea a PR exists, so the title has to carry the defect on its own:
              "v6 carries three incompatible reference frames for the A channel" — not
              "Janis review". Issues #16 and #17 in this repo are what the wrong way
              looks like.
              The body must stand alone WITHOUT the PR: what is wrong, the concrete
              failure it causes, a permalink pinned to THIS commit
              (https://github.com/${{ github.repository }}/blob/${{ github.event.pull_request.head.sha }}/<path>#L<n>),
              and on its own line:
                <!-- review-fingerprint: RF-<8 hex of path + normalised claim> -->

            * **ALREADY OPEN in the ledger** -> do NOT file a second issue. Instead:
                - one inline comment on the PR: this recurs, and a link to the issue;
                - one line on the issue itself: `recurred in #<PR>`.
              This is the most valuable thing you emit. A new finding is news about new
              code; a RECURRENCE says a deferred issue is actively costing review time,
              and nothing else in this lane produces that number. It is INFORMATIONAL —
              it must not block, and it is not a reason to re-argue the deferral.

            * **CLOSED in the ledger** -> this is a REGRESSION, not a recurrence, and it
              is the loudest thing you can find: the defect was fixed and has come back.
              Reopen the issue, say which PR reintroduced it, and call it out by name in
              your summary.

            END YOUR SUMMARY WITH THE LEDGER DIGEST — three lines, and they cost
            nothing because step 0 already holds the whole ledger:

              📒 **Finding ledger** — <N> open · <M> recurred more than once ·
                 oldest open <D> days (#<num>) · dedup <complete|PARTIAL>

            THIS IS THE FORCING FUNCTION, and it is the ONLY one left. Blocking used to
            put the debt in front of the owner — crudely, but it did do it. Nothing else
            in this design does, and "we will check the issues tab" is exactly the
            intention that decays. Printing the number on every PR puts it where someone
            is already reading, without anyone having to remember to look.

            Report it even when it is boring. A digest that appears only when the count
            is alarming teaches the reader that its absence means fine, and then a run
            that failed to fetch the ledger reads as good news. If the dedup was partial
            (see step 0), say **PARTIAL** here too — a debt number from an incomplete
            ledger is a floor, not a count, and it must not be quoted as one.

            NOTHING YOU FILE BLOCKS THIS PR. You are not a gate. Post ONE top-level
            summary: counts by severity, links to what you filed, recurrences and
            regressions named separately, and whether the dedup was complete or partial.
            Inline comments are now RESERVED for recurrences and regressions — that
            scarcity is deliberate, so an inline comment means exactly one thing: the
            owner is paying for something already known.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for findings anchored to specific lines.
            Only post GitHub comments — do not return the review as a chat
            message, or nobody will ever see it.
