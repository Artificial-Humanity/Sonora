name: Janis — PR Review

on:
  pull_request:
    types: [opened, synchronize]

# `synchronize` fires on EVERY push to an open PR. Without this group, three
# quick pushes run three concurrent reviews and you are billed for all three
# while only the last one is worth reading.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip non-human actors CLEANLY, rather than letting the action refuse them.
    #
    # This is a VENDOR-MECHANISM guard, not a statement about who is allowed to
    # write code here. `claude-code-action` refuses a run initiated by a non-human
    # actor — "Workflow initiated by non-human actor ... Add bot to allowed_bots" —
    # and a red X for working-as-designed is noise that trains you to ignore the
    # check, so we skip instead of failing.
    #
    # ⚠ WHEN AGENTS GET THEIR OWN GITHUB IDENTITY, THIS LINE IS THE ONE TO CHANGE
    # (together with the action's `allowed_bots` input). An agent pushing as itself
    # is a `Bot` sender, so leaving this as-is would silently stop reviewing exactly
    # the commits most worth reviewing. Nothing else in this workflow keys on who
    # pushed — the review's scope is bounded by the COMMIT RANGE (step 0 of the
    # prompt), which is identity-agnostic on purpose.
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest

    # REQUIRED — not optional boilerplate. This repo's default workflow token is
    # read-only (`default_workflow_permissions: "read"`, checked 2026-08-10), so
    # without this block the review runs to completion, bills the tokens, and
    # then cannot post a single comment. The failure is silent in the sense that
    # the analysis succeeds; only the delivery fails.
    #
    # ⚠ `issues: write` IS DELIBERATELY ABSENT (owner, 2026-08-11). Findings are
    # resolved IN THE PR now; the reviewer no longer files them as issues. This
    # missing permission is the ENFORCEMENT of that, not a decoration of it — the
    # lesson of AGENTS.md §1 is that a rule in a prompt is not a mechanism. Do not
    # add it back to "let the agent check the issue ledger": there is no ledger in
    # this design. `pull-requests: write` is what carries PR comments, including the
    # top-level summary that `gh pr comment` posts.
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          # Check out the PR HEAD ITSELF, not the default `refs/pull/N/merge`
          # commit. The prompt's step 0 diffs `<last-reviewed-sha>..HEAD`, and on
          # the merge commit that range also drags in whatever landed on the base
          # branch — findings against code this PR never touched.
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history: an incremental review needs the previously-reviewed
          # commit to still be in the clone. A depth-1 clone cannot diff a range,
          # and the failure looks like "the reviewer reviewed everything again".
          fetch-depth: 0

      - name: Set up Python for verification
        # WITHOUT THIS THE AGENT CANNOT CHECK ITS OWN WORK. It once reported
        # "Python execution was blocked in this sandbox" and inferred a sandbox limit;
        # it was not. GitHub runners ship Python — what was missing was the tool grant
        # below, and the deps. So every finding was reasoned from READING, and the fix
        # pass shipped 11 unverified edits on PR #10 (one of which left a latent defect
        # that only surfaced when the tests were run by hand).
        #
        # TORCH IS DELIBERATELY NOT INSTALLED. It is ~2 GB for exactly ONE test file
        # (tests/test_gate_scripts.py). Measured 2026-08-10 without it:
        #   516 passed · 9 skipped · 1 failed (env-gated doc check) — in 3.2 seconds.
        # So ~98% of the suite is verifiable for about a minute of CI, and the last 2%
        # costs more than the whole review does.
        #
        # The FIX pass no longer runs here at all (owner, 2026-08-11) — it runs on the
        # submitting machine via `scripts/fix_pr.sh`, where torch, the ROCm stack, the
        # repo `.venv` and `/data` are all present. That asymmetry is the point: the
        # cheap 98% gates the review, the full env does the repair.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the non-torch test dependencies
        # Best-effort on purpose: a dependency hiccup must not fail the REVIEW, which is
        # useful even when it cannot run anything. The agent is told below to say so
        # rather than claim verification it did not do.
        run: |
          python -m pip install --upgrade pip
          # ⚠ `pysbd` AND `fastapi` ARE NOT OPTIONAL, and their absence was invisible for the
          # lane's whole life. Without them 8 tests FAIL rather than skip on this tree — 3
          # `pysbd` in tests/test_acquisition_lane.py (imported inside a function in
          # synth_common.py, so the module-level importorskip guards do not reach it) and 5
          # `fastapi` in tests/test_ratings_transaction.py. On PR #62's tree it is 11, because
          # that branch adds fastapi-dependent tests.
          #
          # The cost is not the red tests. It is that the reviewer opens a suite showing
          # failures unrelated to the diff it was asked to read, and the rational response to
          # an untrustworthy suite is to stop running it and reason instead — which is exactly
          # the failure this install step exists to prevent, and the mechanism behind three
          # wrong remedies on 2026-08-11.
          #
          # `numpy` is deliberately left unconstrained HERE: pip resolves it fine in this job,
          # and the `numpy<2.5` ceiling that `[dependency-groups].test` carries is a **uv**
          # backtracking problem. Do not add a pin to a resolver that does not need one.
          pip install pytest pyyaml numpy scipy librosa soundfile unidecode inflect pysbd fastapi \
            || echo "DEP INSTALL FAILED — the agent must report findings as unverified"

      - name: Run Claude Review Agent
        uses: anthropics/claude-code-action@v1
        with:
          # The INPUT name is fixed by the action (`claude_code_oauth_token`);
          # the SECRET is the org-level `CLAUDE_OAUTH_TOKEN`. These deliberately
          # do not match — do not "fix" the left side to agree with the right.
          claude_code_oauth_token: ${{ secrets.CLAUDE_OAUTH_TOKEN }}


          # --allowedTools is what actually lets the agent reach GitHub. Without
          # it the model can analyze the diff but has no mechanism to post, so a
          # prompt asking for "inline comments" produces nothing. This is the
          # second half of the permissions problem above: permissions grant the
          # token the right, --allowedTools grants the agent the tool.
          #
          # ⚠ `Bash(gh issue:*)` and `Bash(gh search:*)` ARE DELIBERATELY ABSENT
          # (owner, 2026-08-11) — see the permissions block. The reviewer has no
          # business touching the issue tracker.
          #
          # `Bash(git:*)` is what makes the incremental range in step 0 possible.
          #
          # `--effort` is deliberately absent: it is not a documented claude_args
          # flag, and Claude Code already defaults to xhigh effort on capable
          # models, so naming it buys nothing and risks failing on an unknown arg.
          claude_args: >-
            --model claude-opus-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(git:*),Bash(python:*),Bash(python3:*),Bash(pytest:*),Bash(pip:*)"

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            You are an elite, pedantic Senior Code Reviewer. Review this pull
            request thoroughly, focusing on architectural flaws, edge-case logic
            bugs, security vulnerabilities, and performance bottlenecks.

            The PR branch is already checked out in the working directory, at the
            HEAD SHA above, with full history.


            IDENTITY — you are **Janis**, the reviewer. Begin every comment you post —
            the top-level summary and every inline comment — with exactly:

              🔍 **Janis** · review

            on its own line, then a blank line, then the content. The fix pass now runs
            on the submitting machine rather than in CI, so its replies arrive under a
            different account than yours; the badge is still what tells a reader which
            voice is which within a thread. Never omit it.


            ═══════════════════════════════════════════════════════════════════
            STEP 0 — ESTABLISH YOUR RANGE. DO THIS BEFORE YOU READ ANY CODE.
            ═══════════════════════════════════════════════════════════════════

            You review WHAT HAS NOT BEEN REVIEWED YET, not the whole PR every time.
            Every summary you post ends with a machine-readable marker naming the
            commit you reviewed up to; find the last one you left here:

              gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} \
                --json comments --jq '.comments[].body' \
                | grep -o 'janis-reviewed: [0-9a-f]\{40\}' | tail -1

            * **A marker exists** → that sha is your BASE. Confirm it is still an
              ancestor of HEAD (a rebase or force-push invalidates it):
                git merge-base --is-ancestor <BASE> HEAD
              If it IS an ancestor, your range is `<BASE>..HEAD` — read it with
              `git diff <BASE>..HEAD` and `git log --oneline <BASE>..HEAD`.
              If it is NOT (rebased/force-pushed), fall back to the full PR and SAY SO.

            * **No marker** → this is the PR's first review. Your range is the whole
              PR: `gh pr diff ${{ github.event.pull_request.number }}`.

            **IF THE RANGE IS EMPTY, OR TOUCHES ONLY DOCS** (`*.md`, `notes/`), POST
            NOTHING AT ALL AND STOP. Say it in your run log, not on the PR. A "no new
            findings" comment on every push is how a PR accumulates twelve comments
            that no one reads, and docs-only work is out of review scope (AGENTS.md §5).

            WHY THIS EXISTS, so you do not optimise it away: re-reviewing the whole PR
            after every fix push is a loop — review → fix → push → review → fix — and
            on 2026-08-11 it turned a handful of findings into 25 filed issues in three
            bursts inside half an hour. The range is what makes each lap smaller than
            the last, until there is nothing left and you post nothing.

            ═══════════════════════════════════════════════════════════════════

            DO NOT RE-RAISE WHAT IS ALREADY ON THIS PR. Fetch the existing inline
            comments ONCE and hold them in context:

              gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments \
                --jq '.[] | {path, line, body}'

            If a finding you are about to make is already posted — even against a
            different line of the same defect — say nothing new about it. A repeat is
            worse than a miss: the reader has to re-read the thread to discover you
            said nothing new.

            Read `gh pr view --comments` too. **A reply from the owner, a member or a
            collaborator that overrules a finding IS THE DECISION.** Do not re-argue a
            settled point in a fresh comment; that is the loop wearing a different hat.

            FINDINGS ARE RESOLVED IN THIS PULL REQUEST (owner, 2026-08-11). Post them
            as inline comments on the lines they concern, with an explicit severity, and
            let the fix pass answer them in the thread. **DO NOT FILE ISSUES.** You have
            neither the permission nor the tool, so an attempt will simply fail and
            waste the run. The previous practice — every finding becomes a tracked
            issue — is retired: it converted each review into a backlog that generated
            the next PR, which generated the next review.

            Report every issue that could cause incorrect behavior, a test failure, a
            security weakness, or a misleading result — including findings you are
            uncertain about, marked as uncertain. Give each one an explicit severity so
            it can be triaged. Only omit pure nits: formatting, naming preferences, and
            style that no reader would act on. Do not filter beyond that bar — a
            qualitative instruction like "only report important issues" is followed
            literally and silently drops real bugs.

            VERIFY, DO NOT ONLY REASON. Python and the non-torch test dependencies are
            installed for you — `pytest tests/ -q` runs ~516 tests in about 3 seconds.
            Before you report a finding you could have checked by running something,
            RUN IT. A finding you reproduced outranks three you inferred.

            ⚠ `tests/test_gate_scripts.py` needs torch, which is deliberately NOT
            installed (~2 GB for one file). Skip it rather than reporting its collection
            error as a defect. If the dependency install failed, say so plainly in the
            review and mark every finding as unverified — never imply you ran something
            you did not.

            NOTHING YOU POST BLOCKS THIS PR. You are not a gate. Post ONE top-level
            summary with `gh pr comment`, containing:

              * what range you reviewed — `<BASE>..HEAD` or "full PR (first review)"
                or "full PR (previous marker no longer an ancestor)";
              * counts by severity, and whether findings are verified or unverified;
              * the handoff line, verbatim:
                  Resolve locally: `scripts/fix_pr.sh ${{ github.event.pull_request.number }}`
                  (or `/fix-pr ${{ github.event.pull_request.number }}` in a Claude Code session).
              * and on its own line, LAST, the marker — full 40-character sha:
                  <!-- janis-reviewed: ${{ github.event.pull_request.head.sha }} -->

            ⚠ THE MARKER IS LOAD-BEARING. Omit it and your next run re-reviews the
            entire PR from scratch, billed in full, and re-raises everything you just
            said. It must be the literal HEAD SHA above, in an HTML comment so it is
            invisible in the rendered thread. Write it even when you found nothing (as
            long as the range was non-empty) — a clean range still counts as reviewed.

            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for findings anchored to specific lines.
            Only post GitHub comments — do not return the review as a chat
            message, or nobody will ever see it.
