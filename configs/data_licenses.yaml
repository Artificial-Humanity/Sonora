# License manifest for the training data wall (north star §8.2).
#
# Every dataset that can appear in a training filelist MUST be declared here;
# matcha/data/license_wall.py refuses to train on paths it cannot classify.
# Verified license survey: notes/dataset-landscape.md (this repo — the path above was
# the pre-2026-07-22 umbrella layout). What is on disk and what a run consumes:
# notes/training-sources.md.
#
# class: permissive — allowed in the production corpus
#        nc         — bare CC-BY-NC (no agreement executed). Owner ruling 2026-07-19
#                     (notes/dataset-landscape.md, "NC licensing — the two-fence ruling"):
#                     risk-accepted for training use; SONORA_LICENSE_WALL=derisk +
#                     run-taint are retained as LINEAGE AUDIT (so any release can
#                     disclose exactly what's in the weights), not as prohibition.
#                     Ship/don't-ship NC lineage is a flagged promotion-time call.
#
# Agreement-walled datasets (click-through / "by downloading you agree" terms,
# e.g. EmoV-DB) are FULLY EXCLUDED by the same ruling: never downloaded, never
# ingested, never declared here.
#
# dirs are matched case-insensitively as exact path components of the filelist
# path and of every audio path inside the filelist.

datasets:
  ljspeech:
    dirs: [LJSpeech-1.1, ljspeech]
    license: LJ Speech (LibriVox public domain recordings, public domain texts)
    class: permissive
  libritts_r:
    # The v3 line (v3, v3b phoneme fix, v3c hash split) is the same LibriTTS-R audio
    # under the same CC-BY-4.0 as v1/v2 — only labels and the split differ. It was
    # undeclared until 2026-08-04, which is why no run could ever have reached it: the
    # wall refuses what it cannot classify, so "nothing has trained on v3c" was
    # structurally guaranteed rather than merely true.
    # `libritts_r_holdout_devclean` is the Phase 0a instrument (2026-08-06): LibriTTS-R
    # dev-clean, 40 speakers disjoint from the corpus's 247, derived for SCORING ONLY.
    # It is declared here for the same reason a training corpus is — the wall gates on
    # the filelist path, not on intent, so an undeclared holdout simply refuses to load.
    # Declaring it is NOT permission to train on it: doing so would destroy the one
    # never-trained measurement the lineage has.
    # `libritts_r_vat_v4` (2026-08-07) is again the same audio: the owner's three-rider
    # re-derivation — 8-wide conditioning with the delivery block, D-L2's corrected z
    # guard, and D-M4 homograph resolution. Labels, phonemes and width change; the
    # recordings and their CC-BY-4.0 do not.
    dirs: [LibriTTS-R, libritts_r, libritts-r, libritts_r_vat, libritts_r_vat_v1,
           libritts_r_vat_v2, libritts_r_vat_v3, libritts_r_vat_v3b, libritts_r_vat_v3c,
           libritts_r_vat_v4, libritts_r_holdout_devclean]
    license: CC-BY-4.0
    class: permissive
  merged_vat_corpora:
    # Corpus directories that hold FILELISTS ONLY — no audio — and point at more than one
    # source dataset. `libritts_r_emilia_vat_v5` (2026-08-08, Phase 1 #1) is v4's LibriTTS-R
    # rows verbatim plus the Emilia-YODAS keeps.
    #
    # Declared separately rather than folded into `libritts_r` BECAUSE the classification
    # would be a false statement about the contents. The wall classifies the filelist's own
    # directory as well as every audio directory inside it, so a merged corpus filed under
    # one of its sources reads as "this is LibriTTS-R" — and the next merge, which may pull
    # in something NC, would inherit a permissive label from a name rather than from its
    # audio. The safety here is NOT this entry: it is that every wav path inside is
    # classified on its OWN components, so `emilia_kept_24k` is checked as Emilia-YODAS and
    # `LibriTTS_R` as LibriTTS-R, exactly as if they were separate corpora.
    #
    # The licence a merged corpus carries is therefore the INTERSECTION of its sources'
    # terms, not this line. Both sources here are CC-BY-4.0, so attribution is the whole
    # obligation; a future merge whose sources differ needs that spelled out per source in
    # notes/training-sources.md before it is added to `dirs`.
    #
    # `libritts_r_emilia_expressive_vat_v6` (2026-08-10, Phase 1 rung 2) adds the
    # expressive-registers append set on top of v5. Third source, same rule: its audio is
    # classified as `sonora_expressive_registers` below, not by this line.
    dirs: [libritts_r_emilia_vat_v5, libritts_r_emilia_expressive_vat_v6]
    license: CC-BY-4.0 (filelists only; each audio path is classified by its own source)
    class: permissive
  sonora_expressive_registers:
    # OURS — the ear-certified expressive bank (notes/training-sources.md). Two kinds of
    # audio and NOTHING else, verified by path before declaring rather than assumed:
    #   * 729 teacher renders (qwen · zonos · chatterbox · orpheus · moss_vg) — our own
    #     output, produced by models we run locally under their own weights licences. The
    #     WEIGHTS licence gates whether an engine may be used at all (notes/dataset-
    #     landscape.md); it does not attach to the audio those weights produce.
    #   * 103 LibriVox recordings — public domain, the same basis as `ljspeech`.
    # Checked 2026-08-10: **0 of the 832 staged clips resolve into `LibriTTS_R` or any
    # `emilia*` tree**, so no third-party corpus audio is laundered through this entry.
    #
    # ⚠ `expressive_registers_24k` is the STAGED tree the v6 filelists point at — 24 kHz
    # PCM copies written by `merge_expressive_registers.py`, because 148 of the source
    # clips are 44.1 kHz and the corpus contract is 24 kHz. It is declared alongside the
    # bank for the same reason `emilia_kept_24k` is: the wall classifies the path a
    # filelist actually names, and the resampled tree is that path. Declaring only the
    # bank would refuse every v6 row.
    #
    # ⚠ An engine tag is NOT audio provenance — the lesson that cost this rung 158 rows.
    # 21 rows tagged `scm-spike-v1` live under `sonora-expressive-registers/v1/audio`
    # (synthesis output), while a DIFFERENT 45 rows carrying the same tag were real
    # LibriTTS-R audio and are excluded from v6 entirely. Classify by where the audio
    # lives, never by what produced the row.
    #
    # ⚠ TWO ENTRIES ONLY, AND THAT IS DELIBERATE. A `dirs` name is matched as a path
    # component ANYWHERE on any path, with no scoping to this dataset's tree, so every
    # name added here permissively classifies that component for every filelist this repo
    # will ever check. The v6 campaign dirs (`book-prose`, `librivox-v1`, `newscaster-v1`,
    # `delivery-v1-narration*`, the `artifact-probe-*` set, …) were declared here and
    # bought nothing: `_stage_24k` writes every clip to `expressive_registers_24k/wavs/`,
    # so each v6 audio path names that one component and no other. They only widened the
    # wall. `book-prose` in particular is a SEPARATE dataset in notes/training-sources.md
    # with an open defect against its provenance metadata (A-M6: `book_ingest` hardcodes
    # "Standard Ebooks CC0" even for PG sources) — it needs its own entry with its own
    # licence string when a filelist first names it, not this one's.
    dirs: [sonora-expressive-registers, expressive_registers_24k]
    license: CC-BY-4.0 (ours — teacher renders we produced + LibriVox public-domain
      recordings; published as CC-BY-4.0 on HF)
    class: permissive
  parler_libritts_r_annotated:
    dirs: [parler-tts, libritts-r-filtered-speaker-descriptions]
    license: CC-BY-4.0 (annotations over LibriTTS-R)
    class: permissive
  libritts_r_aligned:
    dirs: [libritts-r-aligned]
    license: CC-BY-4.0 (cdminix prosody measures/alignments)
    class: permissive
  emilia_yodas:
    # The mined keeps live in `emilia_kept` (source mp3) and `emilia_kept_24k` (the 24 kHz
    # wavs + asr.jsonl that a filelist would point at), NOT in a directory called
    # `emilia_yodas` — so until 2026-08-08 `classify_path` matched no component of any
    # keep's path and the wall would have refused the Phase 1 #1 merge outright. Exactly
    # the failure this file's own checklist warns about, and the one that made v3/v3b/v3c
    # structurally unrunnable. `emilia_yodas_probe` is the raw pool the keeps were mined
    # from; declared for completeness, though nothing points a filelist at it.
    #
    # VERIFIED before declaring, not assumed — the adjacent `emilia_original` is NC and a
    # wrong declaration here is how NC audio would reach a shipped checkpoint. All 13,141
    # entries in `emilia_kept/manifest.json` carry
    # `"license": "Emilia-YODAS (CC-BY-4.0 subset of amphion/Emilia-Dataset)"`, and every
    # one traces to a shard in the `EN-B0000xx` set that `emilia_yodas_probe` holds.
    # Component matching is exact, so `emilia_kept` cannot collide with `emilia`.
    dirs: [emilia_yodas, Emilia-YODAS, emilia_kept, emilia_kept_24k, emilia_yodas_probe]
    license: CC-BY-4.0 (YODAS subset ONLY — the original Emilia subset is NC)
    class: permissive
  globe_v2:
    dirs: [globe_v2, GLOBE_V2]
    license: CC0
    class: permissive
  expresso:
    # UNRESOLVED, owner's call. The 2026-07-19 ruling that made this `nc` (risk-accepted)
    # is arguably superseded by the 2026-08-01 no-patent / fully-Apache-2.0 posture, which
    # sets the corpus bar at UNRESTRICTED OPEN REDISTRIBUTION and says explicitly that it
    # is stricter than the old commercial test. CC-BY-NC does not clear that bar. Nothing
    # has trained on it either way. See notes/training-sources.md, "The Expresso conflict".
    # ⚠ STILL UNRESOLVED AS OF 2026-08-12, and do not read the missing fetcher as the answer:
    # `scripts/download_expresso.py` was deleted that day under #26 step 2 as finished
    # one-shot tooling, NOT as a licence ruling. The question above is still open; if it is
    # ever answered yes, the fetcher is in git history.
    dirs: [expresso]
    license: CC-BY-NC-4.0
    class: nc
  emilia_original:
    dirs: [emilia, Emilia]
    license: CC-BY-NC-4.0 (the original 101k-h Emilia subset; repo tag is misleading)
    class: nc
