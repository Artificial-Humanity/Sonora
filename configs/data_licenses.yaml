# License manifest for the training data wall (north star §8.2).
#
# Every dataset that can appear in a training filelist MUST be declared here;
# matcha/data/license_wall.py refuses to train on paths it cannot classify.
# Verified license survey: notes/dataset-landscape.md (this repo — the path above was
# the pre-2026-07-22 umbrella layout). What is on disk and what a run consumes:
# notes/training-sources.md.
#
# class: permissive — allowed in the production corpus
#        nc         — bare CC-BY-NC (no agreement executed). Owner ruling 2026-07-19
#                     (notes/dataset-landscape.md, "NC licensing — the two-fence ruling"):
#                     risk-accepted for training use; SONORA_LICENSE_WALL=derisk +
#                     run-taint are retained as LINEAGE AUDIT (so any release can
#                     disclose exactly what's in the weights), not as prohibition.
#                     Ship/don't-ship NC lineage is a flagged promotion-time call.
#
# Agreement-walled datasets (click-through / "by downloading you agree" terms,
# e.g. EmoV-DB) are FULLY EXCLUDED by the same ruling: never downloaded, never
# ingested, never declared here.
#
# dirs are matched case-insensitively as exact path components of the filelist
# path and of every audio path inside the filelist.

datasets:
  ljspeech:
    dirs: [LJSpeech-1.1, ljspeech]
    license: LJ Speech (LibriVox public domain recordings, public domain texts)
    class: permissive
  libritts_r:
    # The v3 line (v3, v3b phoneme fix, v3c hash split) is the same LibriTTS-R audio
    # under the same CC-BY-4.0 as v1/v2 — only labels and the split differ. It was
    # undeclared until 2026-08-04, which is why no run could ever have reached it: the
    # wall refuses what it cannot classify, so "nothing has trained on v3c" was
    # structurally guaranteed rather than merely true.
    # `libritts_r_holdout_devclean` is the Phase 0a instrument (2026-08-06): LibriTTS-R
    # dev-clean, 40 speakers disjoint from the corpus's 247, derived for SCORING ONLY.
    # It is declared here for the same reason a training corpus is — the wall gates on
    # the filelist path, not on intent, so an undeclared holdout simply refuses to load.
    # Declaring it is NOT permission to train on it: doing so would destroy the one
    # never-trained measurement the lineage has.
    # `libritts_r_vat_v4` (2026-08-07) is again the same audio: the owner's three-rider
    # re-derivation — 8-wide conditioning with the delivery block, D-L2's corrected z
    # guard, and D-M4 homograph resolution. Labels, phonemes and width change; the
    # recordings and their CC-BY-4.0 do not.
    dirs: [LibriTTS-R, libritts_r, libritts-r, libritts_r_vat, libritts_r_vat_v1,
           libritts_r_vat_v2, libritts_r_vat_v3, libritts_r_vat_v3b, libritts_r_vat_v3c,
           libritts_r_vat_v4, libritts_r_holdout_devclean]
    license: CC-BY-4.0
    class: permissive
  parler_libritts_r_annotated:
    dirs: [parler-tts, libritts-r-filtered-speaker-descriptions]
    license: CC-BY-4.0 (annotations over LibriTTS-R)
    class: permissive
  libritts_r_aligned:
    dirs: [libritts-r-aligned]
    license: CC-BY-4.0 (cdminix prosody measures/alignments)
    class: permissive
  emilia_yodas:
    dirs: [emilia_yodas, Emilia-YODAS]
    license: CC-BY-4.0 (YODAS subset ONLY — the original Emilia subset is NC)
    class: permissive
  globe_v2:
    dirs: [globe_v2, GLOBE_V2]
    license: CC0
    class: permissive
  expresso:
    # UNRESOLVED, owner's call. The 2026-07-19 ruling that made this `nc` (risk-accepted)
    # is arguably superseded by the 2026-08-01 no-patent / fully-Apache-2.0 posture, which
    # sets the corpus bar at UNRESTRICTED OPEN REDISTRIBUTION and says explicitly that it
    # is stricter than the old commercial test. CC-BY-NC does not clear that bar. Nothing
    # has trained on it either way. See notes/training-sources.md, "The Expresso conflict".
    dirs: [expresso]
    license: CC-BY-NC-4.0
    class: nc
  emilia_original:
    dirs: [emilia, Emilia]
    license: CC-BY-NC-4.0 (the original 101k-h Emilia subset; repo tag is misleading)
    class: nc
