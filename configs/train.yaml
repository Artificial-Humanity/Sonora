# @package _global_

# specify here default configuration
# order of defaults determines the order in which configs override each other
defaults:
  - _self_
  - data: ljspeech
  - model: matcha
  - callbacks: default
  - logger: tensorboard # set logger here or use command line (e.g. `python train.py logger=tensorboard`)
  - trainer: default
  - paths: default
  - extras: default
  - hydra: default

  # experiment configs allow for version control of specific hyperparameters
  # e.g. best hyperparameters for given model and datamodule
  - experiment: null

  # config for hyperparameter optimization
  - hparams_search: null

  # optional local config for machine/user specific settings
  # it's optional since it doesn't need to exist and is excluded from version control
  - optional local: default

  # debugging config (enable through command line, e.g. `python train.py debug=default)
  - debug: null

# task name, determines output directory path
task_name: "train"

run_name: ???

# tags to help you identify your experiments
# you can overwrite this in experiment configs
# overwrite from command line with `python train.py tags="[first_tag, second_tag]"`
tags: ["dev"]

# set False to skip model training
train: True

# Evaluate on a test set after training, using the best weights.
#
# FALSE, and it has to be: **no model in this repo defines `test_step`**, so
# `trainer.test()` raises MisconfigurationException. It was True — inherited from the
# lightning-hydra template, which assumes one exists — and the only reason nobody hit it
# is that `trainer/default.yaml` sets `max_epochs: -1`, so `trainer.fit()` never returns
# and line 96 of matcha/train.py is unreachable. Every production run has been stopped by
# hand or by the E610 fault, never by finishing.
#
# Found 2026-08-08 by the vat4 smoke run, which is the first thing here to set a finite
# `max_epochs`. Left True it is a trap with teeth: `sonora_training` is
# `restart: unless-stopped`, so the first run that ever terminates normally would crash
# after training and then crash-loop, having already written its checkpoints — a failure
# that looks like a training failure and is not one.
test: False

# simply provide checkpoint path to resume training
ckpt_path: null

# seed for random number generators in pytorch, numpy and python.random
seed: 1234
