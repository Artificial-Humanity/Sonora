# ============================================================================
# RETIRED 2026-08-06 — DO NOT RUN, RESUME, STAGE OR EXPORT THIS EXPERIMENT.
#
# It ran, and the never-trained holdout says it made the model WORSE. ep099 is
# +0.0164 against its own warm start over 5,463 unseen clips, with all three loss
# terms worse and better on only 39.1% of them; it is also +0.0443 worse on v3c's
# OWN val split, and it is not a normalisation artifact (+0.0172 under the v2
# constants it trained with). The ear had already reported "no audible change" —
# it simply could not resolve a 0.9% move, and the direction is down.
#
# Use vat3_finetune ep099 (== the stripped warmstart/vat3_ep099.ckpt) as the base
# for anything downstream. The compose launcher refuses this experiment by name.
#
# This is a verdict on the RUN, not on libritts_r_vat_v3c. The corpus below is
# correct and is what Phase 1 builds on — what the measurement actually says is
# that ~30k clips a model is already fit to has no 100 epochs' worth of signal
# left in it, so the lever is corpus size, not epochs.
#
# Full result: notes/quality-gap-plan.md § 0a. Reproduce: scripts/score_holdout.sh.
# Kept (not deleted) because Phase 1's config will be derived from it, and because
# the measurement must stay reproducible.
# ============================================================================

# The v3c round: same three channels (V = EIV valence combo, A = LUFS, T = phonation
# + harshness) as vat3_finetune, on the CORRECTED corpus. What changed from that run:
#
#   * phonemes  — v2 (what the existing ep099 checkpoint trained on) carries
#     contraction-poisoned IPA on ~6.4% of rows. v3b fixed it.
#   * split     — per-clip blake2b hash of the wav basename instead of a shuffle, so
#     growing the corpus no longer re-rolls val membership.
#   * mel stats — MEASURED on this split, not inherited. v2's were computed on a
#     29,441-clip split; v3 lineage is 31,445 rows.
#
# Warm start from vat3-24k ep099 is legitimate despite its poisoned-phoneme training:
# labels moved almost not at all between v2 and v3 (corr >= 0.9993 per channel on
# shared clips), so a from-scratch retrain is not forced. Architecture is identical,
# so every tensor warms.
#
#   python scripts/make_warmstart.py --experiment vat3c_finetune \
#       --donor <vat3-24k checkpoint_epoch=099.ckpt> \
#       --out /data/model-training/sonora/warmstart/vat3c_init.ckpt
#   python -m matcha.train experiment=vat3c_finetune \
#       ckpt_path=/data/model-training/sonora/warmstart/vat3c_init.ckpt
#
# Pre-flight, both mandatory:
#   * AI-Lab-0/scripts/inference-engines.sh stop — the spin-down rule. ALL inference
#     engines (Gemma director, synth_* renderers, Vocalizer), not just the trainer's.
#   * .venv/bin/python scripts/test_vat_dim_seams.py — the vat_dim guards. This run is
#     still 3-wide; the test is what keeps it honest when delivery makes it 4.
#
# Reading the loss curve: TWO discontinuities sit in logged diff_loss, neither of them a
# model change — the 2026-08-01 bucketing change, and the 2026-08-06 E-M5 masking fix that
# removed the padding-fraction floor (and with it the apparent 3.2x train/val gap). Do NOT
# compare across either boundary. Anything logged by this run before 2026-08-06 is on the
# old, inflated scale.

defaults:
  - override /data: libritts_r_vat_v3c.yaml

tags: ["libritts_r", "vat", "vat3c", "valence", "tension", "energy"]

run_name: vat3c_finetune

model:
