# @package _global_

# Phase 1 rung 2 — the CONDITIONING rung, and the first run that can be judged on
# something other than volume.
#
# ⚠ READ THIS BEFORE THE HOLDOUT NUMBER, NOT AFTER.
#
# **This run is NOT expected to move the holdout much, and a flat result is not a
# failure.** Rung 1 added 27 hours and moved the clean holdout by -0.0606. This adds
# **2.08 hours** — 41,937 train rows against v5's 41,138, 80.6 h against 78.5. Judged as a
# volume run it is a rounding error, and judging it that way is the mistake this block
# exists to prevent.
#
# What it actually buys is the **only delivery signal in the corpus**. v5 carries 45
# delivery-labelled train rows in 41,138 (0.11%), and Documentary/Newscaster/Speech have
# exactly ZERO. v6 carries 822 more across four lanes — Dialogue 344 · Neutral 328 ·
# Newscaster 76 · Speech 68. The delivery block has been eight channels wide since
# 2026-08-07 and has never had data behind it; this is the first run where those channels
# see more than noise.
#
# So the question this run answers is NOT "did loss drop" but "does the delivery channel
# do anything once it has labels" — and the holdout cannot answer that, because it is 40
# LibriTTS dev-clean speakers of audiobook narration, all delivery-`unknown`. The holdout
# is here as a REGRESSION GUARD: if it moves materially WORSE, the append hurt. If it
# holds flat, that is the expected and acceptable result, and the delivery question goes
# to the ear and the Vocalizer's dials.
#
# PREDICTION, recorded before the run exists so this stays a test rather than a story:
#   * holdout: flat to slightly better. A move worse than v5's ep019 by more than the
#     -0.0111 that cleared gate 0a is a REGRESSION and the append is suspect.
#   * T does NOT repeat rung 1's saturation — 23.1% of appended rows on the rail against
#     the Emilia half's 53.6%. If T regresses anyway, the cause is not this rung's mix.
#   * A is near-constant on 638 of 826 appended rows BY CONSTRUCTION (they are loudnorm'd
#     to -23 LUFS), so A learning nothing new from them is expected, not a defect.
#
# WHAT CHANGED FROM v5, in one list:
#   * +826 rows / +2.08 h from sonora-expressive-registers, ear-certified.
#   * n_spks 2,500 -> 3,326, one id per appended clip (owner 2026-08-09).
#   * Delivery goes from 45 labelled rows to 867.
#   * `Documentary` RETIRED into Neutral (owner 2026-08-10). vat_dim is UNCHANGED at 8 —
#     the lane keeps its channel because position is the wire format — so the conditioning
#     trunk is not touched and `ep019` warm-starts into it directly.
#   * data_statistics re-measured: mel_mean -5.699118 / mel_std 2.709244.
#
# Pre-flight, all mandatory:
#   * AI-Lab-AMD/scripts/inference-engines.sh stop — the spin-down rule. ALL inference
#     engines (Gemma director, synth_* renderers, Vocalizer), not just the trainer's.
#   * scripts/test_vat_dim_seams.py — IN-CONTAINER (they need torch). 35 checks.
#     ⚠ Run it with a container that has real shm: the suite and the datamodule both use
#     DataLoader workers, and `sonora_vocalizer` has Docker's default 64 MB /dev/shm,
#     which DEADLOCKS them silently — 8 workers alive at 0.0% CPU, no error, forever. The
#     training service sets `ipc: host` + `shm_size: 16gb` for exactly this reason.
#   * The corpus is licence-declared (configs/data_licenses.yaml): the filelist dir under
#     `merged_vat_corpora`, and its audio under `sonora_expressive_registers`. The merge
#     refuses to write filelists at all if the wall does not accept them.
#   * `data_statistics` MEASURED, not inherited. The move was small (-0.0154 mean) and
#     that was a PREDICTION THAT GOT CHECKED, not a reason to skip it — see the data
#     config for the three-generation comparison.
#   * Warm start built and VERIFIED WIDENED — see below.
#
# ⚠ THE WARM START WIDENS THE SPEAKER TABLE, 2,500 -> 3,326, and that is the one operation
# in this run with a history of failing SILENTLY. The v4->v5 work found `make_warmstart`
# DISCARDING the widened tensor instead of widening it, which trains 826 speakers on a
# randomly-initialised row and reports success. Do not accept the script's exit code as
# proof: `_speaker_prefix_ok` must confirm v5's map is an index-preserving PREFIX of v6's
# (it is — verified 2026-08-10), and the seam suite's widen checks must pass.
#
# JUDGING THIS RUN: score on the never-trained holdout (scripts/score_holdout.sh,
# data/libritts_r_holdout_devclean), NEVER on loss/val_epoch — v6's val set is 1,331 clips
# spanning THREE domains now (LibriTTS, Emilia, expressive-registers), so a move in it
# could be any of them.
#
# ⚠ CHECKPOINT EVERY EPOCH AND EXPECT CONVERGENCE UNDER 10. The v5 run put 100% of its
# gain in epochs 0-9 and epochs 10-39 were net WORSE; the entire useful signal lived
# inside a single checkpoint interval, so the best epoch was never written to disk. The
# compose command already forces `every_n_epochs=1`. Sample accordingly and stop early.

defaults:
  - override /data: libritts_r_emilia_expressive_vat_v6.yaml

tags: ["libritts_r", "emilia_yodas", "expressive_registers", "vat", "vat6", "phase1",
       "rung2", "delivery", "valence", "tension", "energy"]

run_name: vat6_finetune

model:
  use_vat: true
