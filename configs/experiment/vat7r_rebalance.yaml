# @package _global_
#
# Phase 1, the DIVERSITY probe. Not a rung — a 5,000-step question.
#
# THE FINDING THIS ANSWERS. Rung 3 was the volume rung: +303,627 rows, +480 hours, 7x the
# corpus. The holdout moved 3.63% off the v6 donor and then stopped, and it stopped early:
# `prior` was 98% of the way to its final value and `diff` 101% of the way at **step
# 3,505**, which is 112,160 samples, a THIRD of one epoch. Sixty thousand further steps
# bought a 0.5% band of noise. The prediction in `vat7_finetune.yaml` said a flat holdout
# would be the finding and a big one. It was not flat, but it was flat EARLY, which says
# the same thing: the corpus stopped being the binding constraint almost immediately.
#
# Composition is why. v7 is 96.6% LibriTTS-R read speech, and every one of the 303,627 new
# rows is more of exactly that. Meanwhile the rung DILUTED the other two sources: Emilia
# fell 25.4% -> 3.2% and expressive-registers 1.9% -> 0.24%.
#
# PREDICTION, recorded before the run exists so this stays a test rather than a story:
#   * The dev-clean holdout `total` gets WORSE, or does not move. That is the EXPECTED
#     result and it is not a failure. The holdout is dev-clean LibriTTS; this run spends
#     24% of every batch on other domains. A large improvement there would be surprising
#     and would need explaining, not celebrating.
#   * The REGRESSION BAR is what matters: `total` must stay within about 1% of v7's best
#     (1.76435). Beyond that the run is trading clean read speech for the rest, which is
#     not the deal.
#   * The real verdict is the EAR, on the same prompts, blind against
#     `checkpoint_epoch=001_step=0017529.ckpt`. The owner's complaint is expressive
#     quality, and no instrument we own measures it.
#   * ⚠ If the ear says nothing changed, that is a REAL result and an expensive one to
#     get wrong: it would mean diversity at this ratio is not the lever either, and the
#     gap is capacity, decoder or distillation. Do not re-run at 40% to rescue it without
#     saying so out loud first.
#
# ============================================================================
# MEASURED 2026-08-29 — the prediction held. All four checkpoints scored in ONE
# GPU run, so every number below is comparable to every other number below.
#   `total`, 5,463 dev-clean holdout clips, 4 samples, v7's `data_statistics`:
#     v7 donor  ep001s0017529   1.764570     -
#     v7r       s0003505        1.767259   +0.15%
#     v7r       s0007011        1.775798   +0.64%
#     v7r       s0010517        1.769839   +0.30%
#   PASSES the 1% regression bar. The worst arm is 0.64% off, the best 0.15% off.
#
# ⚠ THE MOVEMENT IS ALMOST ALL IN `dur`. Per-component deltas off the donor:
#     s0003505   dur +0.0032   prior -0.0008   diff +0.0003
#     s0007011   dur +0.0096   prior +0.0009   diff +0.0008
#     s0010517   dur +0.0046   prior +0.0002   diff +0.0005
#   `dur` accounts for the whole `total` delta at all three checkpoints. The mel
#   decoder moved 0.13%-0.34%. So the rebalance did not damage clean-read
#   ACOUSTICS. It retimed them, which is what a 9x speaking-rate shift predicts.
#   Anyone who reads this run as "diversity hurt audio quality" reads it wrong.
#
# ⚠ THE REGRESSION IS REAL AND IT IS TINY. Those are two separate statements and
#   both belong here. Paired per clip across 5,463 pairs, the smallest arm gives
#   t=+4.73 and the largest t=+18.43 — not noise. But d=0.06, and v7r wins on
#   46.8% of clips at s0003505. Per clip it is a coin flip.
#   ⚠⚠ A MEAN-ONLY READ SAYS THE OPPOSITE, and it is the trap in this table. The
#   v7r run's own three means span 0.0085, THREE TIMES the 0.0027 donor gap. That
#   invites "the instrument cannot separate these models", which is false. Pairing
#   removes per-clip difficulty, and difficulty is the dominant variance here.
#   Compute the paired number before making that claim. I nearly did not.
#
#   Instrument noise floor, because these digits are small: this scoring
#   reproduced the donor at 1.764570 and matches `baseline_init_vs_trained` to six
#   decimal places. The CPU watcher scored the SAME checkpoint at 1.764353, which
#   is 0.012% away — same clips, same samples, same statistics. So 0.012% is the
#   cross-device band, and it is 12x smaller than the smallest effect above.
#   ⚠ Cross-DEVICE, not cross-run: only compare CPU with CPU, or GPU with GPU.
#
# ⚠ NO VERDICT HERE, AND THE HOLDOUT CANNOT SUPPLY ONE. It is dev-clean LibriTTS.
#   This run bought diversity, and this measurement prices the COST at under 1%.
#   It cannot see the PURCHASE. The blind ear test against `ep001s0017529` is the
#   verdict, and it RAN — see below.
# ============================================================================
#
# ============================================================================
# EAR VERDICT, 2026-08-30. Owner, blind, 28 forced-choice pairs, donor vs
# v7r s0010517. NEITHER SET REACHED SIGNIFICANCE.
#
#   Set A (delivery blank, V/A/T varied — the 22% lever):
#     donor 3 · v7r 9 · no difference 4      sign test on 12 splits, p = 0.146
#   Set B (V/A/T neutral, lane requested — the 1.7% lever):
#     donor 6 · v7r 5 · no difference 1      sign test on 11 splits, p = 1.000
#
# ⚠⚠ THE NOTES CARRY A LARGER FINDING THAN EITHER TALLY, AND IT IS NOT ABOUT THIS
# RUN. The complaint in nearly every note is a ROBOTIC / ELECTRONIC HUM, present in
# BOTH arms: 8/8 notes on speaker 4899, 12/12 across Set B, 4/8 on speaker 4896.
# "Both sound very robotic, and neither would be passable." No corpus rebalance
# addresses that, and it is the ceiling the owner has been describing.
#
# ⚠ SPEAKER DOMINATES CHECKPOINT. Same text, same settings, two voices:
#     spk4896 (LibriTTS 5181): donor 3 · v7r 3 · tie 2  — a dead heat, "both good"
#     spk4899 (LibriTTS 5198): donor 0 · v7r 6 · tie 2  — "highly robotic" throughout
#   ⚠ POST-HOC SUBGROUP. p = 0.031 on the 4899 split, and that number is NOT a
#   result: the split was chosen after seeing the data, which is how a 1-in-32
#   coincidence gets published. It is a HYPOTHESIS — "diversity helps where the
#   voice is weak and does nothing where it is already good" — and it needs a
#   PRE-REGISTERED test on new speakers chosen by their donor quality.
#
# ⚠ DESIGN FLAW IN THIS TEST, RECORDED SO THE NEXT ONE DOES NOT REPEAT IT: Set A
# and Set B share ZERO text, and Set B has no delivery-BLANK control. The notes
# suggest lane-conditioned renders are worse (12/12 robotic vs 4/8 on the same
# speaker in Set A) — but text is confounded with lane, so THAT COMPARISON CANNOT
# BE MADE FROM THIS DATA. The fix is 6 clips: the three Set B texts rendered
# blank-lane, same speaker, same V/A/T.
#
# WHAT THIS LICENSES, AND WHAT IT DOES NOT:
#   ✅ Set A pulled its lever properly at 22% and produced no significant gain. For
#      GENERAL naturalness, corpus diversity at this ratio is not a large lever.
#      That does point at capacity / decoder / distillation.
#   ❌ Set B did NOT pull its lever — 74 distinct Newscaster clips, 65 Speech,
#      repeated 9x (see the data config). Its null says nothing about the delivery
#      channel except that 834 clips is not enough. Do not read it as "delivery
#      conditioning does not work".
#   ⚠ Newscaster went 3-0 to the DONOR. n=3, p=0.250, so it is not a finding — but
#      it is the direction 9x-repeating 74 clips would predict if it overfits.
# ============================================================================
#
# WHAT CHANGED FROM v7, in one list:
#   * the data config only — `libritts_r_full_vat_v7r`, v7's rows with the minority
#     repeated 9x. Read that file before this one; it carries the deliberate
#     `data_statistics` exception and the reason it is bounded to a short run.
#   * NOTHING ELSE. Same model, same vat_dim, same batch size, same lr, same speaker table.
#     One variable is the entire point.
#
# ⚠ NO WATCHER FOR THIS RUN, AND THAT IS DELIBERATE. `vat7-gate-watch.timer` polls
# `logs/train/vat7_finetune` BY NAME, and pointing it here needs a systemd unit edit that
# takes root. A 5,000-step run is about one hour; the watcher exists for multi-day runs
# where the owner cannot sit with it. Score the checkpoints by hand afterwards with
# `scripts/stages/score_holdout.py` against `holdout_8w.txt` — 8-wide, not the 3-wide
# vat3-era `holdout.txt`, which an 8-wide config refuses on the vat_dim seam.
#
# Pre-flight, all mandatory:
#   * AI-Lab-AMD/scripts/inference-engines.sh stop — the spin-down rule. ALL engines.
#   * ⚠ THIS RUN GOT A CADENCE IT DID NOT ASK FOR, AND THE HOLE IS NOW FIXED — read this
#     before trusting any older launch line. On 2026-08-29 the `sonora_training` command
#     READ `${SONORA_CKPT_EVERY_N_STEPS:-3506}` while compose never put that variable in
#     the container, so the fallback always won. This run asked for 1,000 and got 3,506;
#     the only evidence anywhere was the first checkpoint being named `step=0003505`,
#     which is why its checkpoints sit at 3,505 / 7,011 / 10,517.
#     ✅ Fixed the same day in AI-Lab-AMD `3b5711f` — the passthrough is declared, and
#     `SONORA_CKPT_EVERY_N_STEPS=<n>` now works. Verified against the pre-fix file as a
#     negative control: fixed gives 3506 unset and 1000 when set; pre-fix gives ABSENT in
#     both arms.
#     ⚠ `SONORA_CKPT_FILENAME` is still deliberately NOT overridable and is a CONSTANT
#     spelled as a variable: its braces must reach Hydra backslashed, and `{step:07d}` is
#     load-bearing. Setting it from a shell is a crash-loop at LAUNCHING, not a knob.
#   * The warm start built from v7's BEST, and VERIFIED to have widened nothing:
#     n_spks is 5,385 in both corpora, so every tensor shape matches and `spk_emb.weight`
#     copies verbatim. `shape-mismatched (fresh)` must print EMPTY. If it names anything,
#     stop — a fresh speaker table would make this run measure nothing.
#
#   python scripts/lib/make_warmstart.py --experiment vat7r_rebalance \
#       --donor /data/model-training/sonora/logs/train/vat7_finetune/runs/2026-08-29_01-45-09/checkpoints/checkpoint_epoch=001_step=0017529.ckpt \
#       --out /data/model-training/sonora/warmstart/vat7r_init.ckpt
#   SONORA_EXPERIMENT=vat7r_rebalance \
#   SONORA_WARMSTART=/data/model-training/sonora/warmstart/vat7r_init.ckpt \
#     docker compose --profile training up -d sonora_training
#
# ⚠ THIS RUN'S CHECKPOINTS LANDED AT 3,505 / 7,011 / 10,517, not every 1,000 — see the
# cadence note above; that hole is fixed, so a NEW run gets the cadence it asks for. The "5,000 steps" in this file's title is an ORDER OF MAGNITUDE, not a
# boundary the run can hit. **Stop AT a checkpoint**: stopping between them throws away
# every step since the last one. 7,011 gives two points; 10,517 gives three, which is a
# curve rather than a pair.
#
# ⚠ THE RUN IS STOPPED BY HAND. `sonora_training` has no env hook for
# `trainer.max_steps` and `trainer.max_epochs` is -1, so the run does not end on its own —
# the same as every run in this lineage, all of which were stopped by the owner. Checkpoints
# land every 3,506 steps, so stopping late costs GPU time and stopping early costs data.
# Stop with:
#     docker compose stop sonora_training
# `restart: unless-stopped` keeps a manually stopped container stopped, including across a
# reboot, so this does not need undoing afterwards.
#
# ⚠ `ep001s0017529` IS THE DONOR AND IT IS NOT THE LAST CHECKPOINT. It is v7's best on the
# holdout (1.764353 on CPU, 1.764570 on GPU — see the noise-floor note above and do not
# mix the two), reached in 17,529 steps of a 63,107-step run. Warm-starting from
# `last.ckpt` would start this probe from a checkpoint measurably worse than the one it is
# being compared against, and every result would read as a diversity effect.
#
# ⚠ THREE CHECKPOINT OVERRIDES AND ALL THREE ARE LOAD-BEARING. Taken from the v7 run's own
# resolved `.hydra/config.yaml` — the artifact that would have changed if the fact had —
# rather than from the repo default, which describes a cadence this lineage stopped using.
#   * `every_n_epochs=null` — **Lightning REFUSES two cadences at once.** The repo default
#     is `every_n_epochs: 1`, so setting only `every_n_train_steps` errors at construction.
#   * `filename=...{step:07d}` — without the step, several saves inside one epoch resolve
#     to ONE name and overwrite each other, leaving only the last. That is the granularity
#     this probe exists to avoid: v7's answer was visible at step 3,505.
#   * `save_top_k=-1` — the default is `monitor: epoch` / `mode: max` / `save_top_k: 10`,
#     "keep the ten HIGHEST-NUMBERED epochs". Early is where the answer is.
#
# JUDGING THIS RUN: score on the never-trained holdout as a REGRESSION check, never on
# `loss/val_epoch`, and never as proof of improvement. The val split is v7's, unchanged, so
# it is comparable — and it is still contaminated, still three domains, still not a
# generalization measure. Selection stays an ear job.

defaults:
  - override /data: libritts_r_full_vat_v7r.yaml

tags: ["libritts_r", "emilia_yodas", "expressive_registers", "vat", "vat7r", "phase1",
       "probe", "rebalance", "diversity", "delivery"]

run_name: vat7r_rebalance

model:
  use_vat: true
