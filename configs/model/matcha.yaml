defaults:
  - _self_
  - encoder: default.yaml
  - decoder: default.yaml
  - cfm: default.yaml
  - optimizer: adam.yaml

_target_: matcha.models.matcha_tts.MatchaTTS
n_vocab: 178
n_spks: ${data.n_spks}
spk_emb_dim: 64
n_feats: 80
data_statistics: ${data.data_statistics}
out_size: null # Must be divisible by 4
prior_loss: true
use_precomputed_durations: ${data.load_durations}

# VAT conditioning (notes/vat-channels.md §1; was vat-conditioning-design.md). Off by default;
# the milestone-3 directability experiment enables it. When on: FiLM
# (zero-init scale+shift) per encoder/decoder block, per-token [B,3,T] input,
# conditioning dropout keeps VAT=0 a trained neutral.
use_vat: false
# 3 (V/A/T) + 5 one-hot delivery lanes = 8. Contract v2, ARCHITECTURE.md §1; the encoding
# is `matcha/delivery.py` and nothing may spell it out a second time. THE SINGLE SOURCE OF
# TRUTH FOR WIDTH: every data config interpolates `${model.vat_dim}`, so this line decides
# what the filelist parse, the collate and the FiLM trunk all expect, and
# `scripts/gates/test_vat_dim_seams.py` is what makes a disagreement fail loudly at the filelist
# instead of quietly at the trunk.
#
# `unknown` delivery is all five lanes at zero, so a v1 (3-channel) corpus re-derived at
# this width produces exactly the conditioning it always did — the four extra channels are
# inert until a clip carries a label.
vat_dim: 8
vat_cond_dim: 256
vat_cond_dropout: 0.15
