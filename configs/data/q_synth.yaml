# Arm Q of Step 2 (Notes: Sonora/phase-1s-step1-preregistration.md § Step 2 — Arm Q): a synthetic
# 90-speaker corpus of Qwen3-TTS voices (qwen_base clones, qwen_custom presets, one orpheus voice),
# 22.05 kHz on stock's mel (8 kHz ceiling) for the universal vocoder. No VAT. Built by
# scripts/tools/render_step2_corpus.py build-corpus; about 31,000 rows, 900 of them validation.
_target_: matcha.data.text_mel_datamodule.TextMelDataModule
name: q_synth_22k
train_filelist_path: data/q_synth_22k/train_op.txt
valid_filelist_path: data/q_synth_22k/val_op.txt
batch_size: 32
num_workers: 20
pin_memory: True
cleaners: [no_cleaners]
add_blank: True
n_spks: 90
n_fft: 1024
n_feats: 80
sample_rate: 22050
hop_length: 256
win_length: 1024
f_min: 0
f_max: 8000
data_statistics:
  # PLACEHOLDER: F1's values, until `render_step2_corpus.py mel-stats` writes
  # data/q_synth_22k/mel_statistics.json. Replace both numbers from that file before any training
  # run; a placeholder here would train Q on F1's mel normalisation.
  mel_mean: -5.145988
  mel_std: 2.322516
seed: ${seed}
load_durations: false
load_vat: false
