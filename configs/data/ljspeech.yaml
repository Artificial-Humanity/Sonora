# Upstream's demo dataset, and the DEFAULTS BASE that `hi-fi_en-US_female.yaml` and
# `vctk.yaml` inherit from — which is why it stays even though nothing trains on LJSpeech.
# ⚠ The filelists below are no longer buildable by a script in this repo:
# `scripts/prepare_ljspeech.py` split `metadata.csv` into them and was deleted 2026-08-12
# (#26 step 2). It is 52 lines in git history. `phonemize_filelist.py` still produces the
# `_op` variants that `ljspeech_op.yaml` reads, but it reads THESE as its input.
_target_: matcha.data.text_mel_datamodule.TextMelDataModule
name: ljspeech
train_filelist_path: data/LJSpeech-1.1/train.txt
valid_filelist_path: data/LJSpeech-1.1/val.txt
batch_size: 32
num_workers: 20
pin_memory: True
cleaners: [english_cleaners2]
add_blank: True
n_spks: 1
n_fft: 1024
n_feats: 80
sample_rate: 22050
hop_length: 256
win_length: 1024
f_min: 0
f_max: 8000
data_statistics:  # Computed for ljspeech dataset
  mel_mean: -5.536622
  mel_std: 2.116101
seed: ${seed}
load_durations: false
