[build-system]
# NOTE: the training and eval containers install with `--no-build-isolation`, which
# ignores this list entirely and builds against whatever is already in the image. These
# pins therefore describe an isolated build only — they were `cython==0.29.35,
# numpy==1.24.3` until 2026-08-06, both years stale and both silently inert in the lane
# that actually builds this package. Kept as floors, not as a claim about our runtime.
requires = ["setuptools>=64", "wheel", "cython>=3.0", "numpy>=1.24", "packaging"]

[project]
# `sonora`, not `matcha-tts`. This is a fork with its own conditioning trunk, corpus and
# licence posture, and the distribution name is what a package index would publish it as
# — the upstream name was accurate for the code in 2024 and is misattribution now. The
# IMPORT package is still `matcha`, which is ordinary for a fork and keeps every existing
# `from matcha...` working. Upstream attribution lives in NOTICE and README-Matcha.md.
name = "sonora"
dynamic = ["version"]
description = "Sonora — a directable TTS acoustic model with V/A/T conditioning, on the Matcha-TTS flow-matching architecture"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Artificial Humanity, LLC" }]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Private :: Do Not Upload",
]

# THE RUNTIME SET, and it is now the single source of truth — `requirements.txt` is gone.
# That file was the upstream list and had drifted both ways: it declared seven packages
# nothing in this repo imports (torchvision, torchmetrics, tensorboard, pandas, notebook,
# ipywidgets, seaborn) and OMITTED three that are imported at module scope (soundfile,
# tqdm, PyYAML), which have been resolving by transitive luck through librosa. Derived by
# walking every import in matcha/, tests/ and vocalizer.py, not by editing the old list.
dependencies = [
  "torch>=2.0.0",
  "torchaudio",
  "lightning>=2.0.0",
  "hydra-core==1.3.2",
  "hydra-colorlog==1.2.0",
  "omegaconf",
  "rootutils",
  "rich",
  "numpy",
  "scipy",
  "librosa",
  "soundfile",
  "einops",
  "conformer==0.3.2",
  "diffusers",
  "inflect",
  "Unidecode",
  "matplotlib",
  "tqdm",
  "PyYAML",
]

[project.optional-dependencies]
# GPL-3.0, AND IT STAYS OPTIONAL. `phonemizer` shells out to espeak-ng; README § 3 says
# espeak is banned from the runtime path, and the licence wall enforces that for data
# while nothing enforced it for dependencies — an unconditional GPL dep in an Apache-2.0
# project that never imports it on any live path. `matcha/text/cleaners.py` imports it
# lazily precisely so this works: only the legacy LJSpeech checkpoints need it, through
# `english_cleaners2`. Everything current phonemizes with op_g2p.
espeak = ["phonemizer"]
# `assert_model_downloaded` fetches upstream demo checkpoints. Lazily imported since
# 2026-08-06 so the training and eval containers stop carrying two network deps to run a
# code path they never take.
download = ["gdown", "wget"]
onnx = ["onnxruntime"]
# The Sonora Vocalizer (vocalizer.py) — the standing vetting surface.
vocalizer = ["gradio", "fastapi", "uvicorn", "starlette"]
# The `app` extra (`gradio==3.43.2`, for matcha/app.py) was REMOVED 2026-08-07 with the
# file. It also pinned a second, older gradio against the `vocalizer` extra's unpinned
# one, so installing both resolved to whichever came last.
# `fastapi` is here because the audition app came home in `2399aed` and its code is now
# ours to test. Without it every test that drives `audition/app/main.py` can only skip, and
# QC-M5 — the app silently overwriting a script's commit — is exactly the kind of defect a
# source-string test cannot see. The app's own runtime pins live in
# `audition/requirements.txt`; this is the test-time import only.
# `pysbd` is likewise a TEST dependency: tests/test_acquisition_lane.py drives the dialogue
# chunker through `synth_common.py`, which imports pysbd INSIDE the function — so the
# `importorskip` guards at the top of that file do not cover it and three tests FAIL
# outright rather than skipping. Added 2026-08-11.
#
# ⚠ THIS EXTRA STILL DOES NOT PRODUCE A RUNNABLE SUITE, and an earlier version of this
# comment claimed it was meant to. `.[dev]` inherits `dependencies` above, which pins
# nothing on numpy (so it resolves to 2.2+, which no numba supports, and the resolver
# walks numba back to a 2021 release that cannot build on 3.12) and pulls **torch** —
# ~2 GB. ⚠ NOT for "one test file": torch gates `tests/test_cli_lanes.py` and
# `tests/test_training_seams.py` by module-scope importorskip, plus
# `tests/test_gate_scripts.py`, which shells out to a torch-importing script — ~20 tests
# across three modules. That is the number the no-torch decision actually rests on, so
# quoting it as one file understated what is being given up. The set MEASURED to work on a
# host is the one in `scripts/fix_pr.sh`'s refusal message: pytest, pyyaml, "numpy<2.2",
# scipy, librosa, soundfile, unidecode, inflect, fastapi, pysbd. Fixing that properly
# means constraining numpy in `dependencies` or adding a torch-free test extra, and
# neither is this PR's business.
dev = ["pytest", "pre-commit", "fastapi", "pysbd"]

# ── The test set ──────────────────────────────────────────────────────────────────────
# PEP 735 dependency GROUP, deliberately not a `[project.optional-dependencies]` extra
# (owner approved "a test extra", 2026-08-11; the mechanism had to change, the intent did
# not). An extra is ADDITIVE to `[project.dependencies]`, so `pip install '.[test]'` would
# still drag **torch** — ~2 GB for one test file that skips without it — which is the exact
# thing the set exists to avoid. A dependency group installs on its own:
#
#     uv venv
#     uv pip install --python .venv/bin/python --group test
#
# ⚠ Needs a uv new enough to implement PEP 735 groups. Known-good: uv 0.11.29 (x86_64-unknown-linux-gnu). If `--group` is
# rejected as an unknown flag, upgrade uv rather than reaching for the `dev` extra.
#
# THIS IS THE ONE ANSWER TO "WHAT DO I INSTALL TO RUN THE SUITE", and unlike the prose it
# replaces it is executable. Measured on ai-lab-0 2026-08-11: 510 passed / 6 failed /
# 11 skipped in 1.6 s, the six being absent corpus artifacts under `data/`.
#
# ⚠ `numpy<2.5` is a CEILING TRACKING NUMBA'S OWN (`numba 0.66` declares `numpy<2.5,>=1.22`).
# Raise it as numba raises theirs; do not drop it, and do not tighten it — an earlier `<2.2`
# was needlessly tight and its stated reason was wrong.
# WHAT UNCONSTRAINED ACTUALLY DOES, measured with uv 0.11.29 on 2026-08-11:
#     numpy==2.5.2  numba==0.53.1  librosa==0.11.0
# uv holds numpy at newest, so numba must fall below its own numpy ceiling, and librosa must
# fall below its `numba>=0.61.0` floor to let it. The install then FAILS building numba 0.53.1
# on 3.12 — a numba build error, reached only because librosa was walked back far enough to
# permit that numba. The downgrades are
# planned in the resolution and never installed; the pin prevents both.
# ⚠ `pysbd` is imported INSIDE a function in `synth_common.py`, so the `importorskip`
# guards in tests/test_acquisition_lane.py do not cover it: without it three tests FAIL
# rather than skip.
# ⚠ `fastapi` is the audition app's test-time import (see the `dev` extra), and
# tests/test_ratings_transaction.py needs it — 5 failures on a runner that lacks it.
[dependency-groups]
test = [
  # ⚠ `>=9.1` is a FLOOR ON AN EXCEPTION ENVELOPE, not a version bump (issue #47).
  # `pytest.importorskip` decides what counts as "not available", and the retirement guards
  # depend on that envelope being narrow; unpinned, an older resolution silently restores the
  # wide one and the guards can go quiet with nobody editing a test.
  # ⚠ This is the ONLY declaration of the floor. The `dev` extra ABOVE does not carry it (#62
  # dropped its `dev`-line edit rather than merging a union). Remove this and the floor is
  # gone — the two are not belt-and-braces.
  "pytest>=9.1",
  "pyyaml",
  "numpy<2.5",  # see the note above — a CEILING, tracking numba's

  "scipy",
  "librosa",
  "soundfile",
  "unidecode",
  "inflect",
  "fastapi",
  "pysbd",
]

[project.scripts]
matcha-data-stats = "matcha.utils.generate_data_statistics:main"
matcha-tts = "matcha.cli:cli"
matcha-tts-get-durations = "matcha.utils.get_durations_from_trained_model:main"
# `matcha-tts-app = matcha.app:main` was REMOVED 2026-08-06 (E-L4). app.py called
# `.launch(share=True)`, so an installed console script one word long stood up a public
# gradio tunnel to a machine holding unreleased checkpoints and the corpus. The file
# itself was deleted 2026-08-07: it phonemized through `english_cleaners2`
# unconditionally, which is the one thing no Sonora checkpoint may be fed.

[tool.setuptools.dynamic]
version = { file = "matcha/VERSION" }

[tool.setuptools.packages.find]
exclude = ["tests*", "examples*", "notes*", "scripts*", "configs*"]

[tool.black]
line-length = 120
target-version = ['py310']
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
  | foo.py           # also separately exclude a file named foo.py in
                     # the root of the project
)
'''

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
]
# --doctest-modules was dropped: it imports every module under testpaths, which
# for this repo means dragging torch, a GPU and the litert harness into a plain
# `make test`. The gate scripts are run as subprocesses instead (tests/).
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = "True"
markers = [
  "slow: slow tests",
]
minversion = "6.0"
testpaths = "tests/"

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]
